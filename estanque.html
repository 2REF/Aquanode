<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AquaNode | Estanque</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
<style>
:root {
  --bg: #f0f4f8;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #1a202c;
  --muted: #718096;
  --blue: #0a84ff;
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --teal: #32ade6;
  --purple: #5856d6;

  --TEMP_OBJ_MIN: 18;
  --TEMP_OBJ_MAX: 24;
  --GAUGE_ABS_MIN: 10;
  --GAUGE_ABS_MAX: 35;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

/* Fondo decorativo */
body::before {
  content: '';
  position: fixed;
  top: -40%;
  left: -20%;
  width: 80vw;
  height: 80vw;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(10,132,255,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ── */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 48px;
  background: var(--blue);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(10,132,255,0.3);
}
.top-logo {
  color: white;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.3px;
}
.top-logo span { font-weight: 300; opacity: 0.75; font-size: 13px; margin-left: 6px; }

.conn-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  color: white;
  font-family: 'DM Mono', monospace;
}
.conn-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transition: all 0.3s;
  flex-shrink: 0;
}
.conn-dot.ok { background: #a8ffb8; box-shadow: 0 0 6px #a8ffb8; animation: pulse 2s infinite; }
.conn-dot.err { background: #ffaaaa; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── CARD PRINCIPAL ── */
.wrapper {
  position: relative;
  z-index: 1;
  margin-top: 48px;
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 20px 0;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 28px 28px 22px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  position: relative;
  overflow: hidden;
  transition: box-shadow 0.3s;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--blue), var(--teal));
  border-radius: 24px 24px 0 0;
  transition: background 0.4s;
}
.card.hot::before { background: linear-gradient(90deg, var(--orange), var(--red)); }
.card.cold::before { background: linear-gradient(90deg, var(--teal), var(--purple)); }

.card.flash { animation: cardFlash 0.5s ease; }
@keyframes cardFlash {
  0%   { box-shadow: 0 0 0 3px rgba(10,132,255,0.4); }
  100% { box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
}

/* Etiqueta */
.card-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-name {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
}
.status-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  font-family: 'DM Mono', monospace;
  background: #f0fff4;
  color: var(--green);
  transition: all 0.3s;
}
.status-pill.warn { background: #fff8f0; color: var(--orange); }
.status-pill.hot  { background: #fff0f0; color: var(--red); }
.status-pill.cold { background: #f0f8ff; color: var(--teal); }
.status-pill.wait { background: #f7fafc; color: var(--muted); }
.status-dot-sm {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: currentColor;
}

/* Temperatura grande */
.temp-display {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  margin-bottom: 8px;
}
.temp-big {
  font-family: 'DM Mono', monospace;
  font-size: 88px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -5px;
  transition: color 0.4s;
  color: var(--green);
}
.temp-big.cold   { color: var(--teal); }
.temp-big.normal { color: var(--green); }
.temp-big.warn   { color: var(--orange); }
.temp-big.hot    { color: var(--red); }
.temp-big.offline{ color: #ccc; }

.temp-unit-big {
  font-size: 28px;
  font-weight: 400;
  color: var(--muted);
  margin-bottom: 14px;
}

/* Badge tendencia */
.trend-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  font-family: 'DM Mono', monospace;
  margin-bottom: 16px;
}
.trend-badge.up-bad    { background: #fff1f0; color: var(--red); }
.trend-badge.down-good { background: #f0fff4; color: #22a84a; }
.trend-badge.neutral   { background: #f7fafc; color: var(--muted); }

/* Min/Max */
.minmax {
  display: flex;
  gap: 20px;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  margin-bottom: 18px;
}
.minmax-max { color: var(--orange); font-weight: 700; }
.minmax-min { color: var(--purple); font-weight: 700; }

/* Gauge */
.gauge-wrap { margin-bottom: 14px; }
.gauge-track {
  position: relative;
  height: 13px;
  border-radius: 999px;
  background: #edf2f7;
  overflow: visible;
  margin-bottom: 5px;
}
.gauge-target {
  position: absolute;
  top: 0; bottom: 0;
  border-radius: 999px;
  background: rgba(52,199,89,0.18);
  border: 1px solid rgba(52,199,89,0.45);
  pointer-events: none;
  transition: left 0.3s, width 0.3s;
}
.gauge-fill {
  position: absolute;
  top: 0; bottom: 0; left: 0;
  border-radius: 999px;
  background: var(--blue);
  max-width: 100%;
  transition: width 0.65s cubic-bezier(0.34,1.4,0.64,1), background 0.4s;
}
.gauge-needle {
  position: absolute;
  top: -5px; bottom: -5px;
  width: 4px;
  border-radius: 2px;
  background: var(--text);
  transform: translateX(-50%);
  z-index: 2;
  box-shadow: 0 1px 6px rgba(0,0,0,0.25);
  transition: left 0.65s cubic-bezier(0.34,1.4,0.64,1), background 0.4s;
}
.gauge-needle::before {
  content: '';
  position: absolute;
  top: -4px; left: 50%;
  transform: translateX(-50%);
  width: 8px; height: 8px;
  border-radius: 50%;
  background: inherit;
}
.gauge-limits {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
}

/* Última actualización */
.last-update {
  text-align: right;
  font-size: 11px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
}

/* ── CARD OFFLINE ── */
.offline-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 40px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.06);
}
.offline-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }

/* ── INFO CARD ── */
.info-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
}
.info-card strong { color: var(--blue); font-size: 13px; }

/* ── RANGO ── */
.range-info {
  background: linear-gradient(135deg, #e8f4ff, #f0fff4);
  border: 1px solid #c3e6ff;
  border-radius: 14px;
  padding: 14px 18px;
  display: flex;
  gap: 20px;
  font-size: 12px;
  font-family: 'DM Mono', monospace;
}
.range-item { display: flex; flex-direction: column; gap: 2px; }
.range-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.range-val { font-weight: 700; font-size: 12px; color: var(--text); white-space: nowrap; }

/* ── WAITING ANIMATION ── */
.waiting {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 20px 0;
}
.waiting-dots {
  display: flex;
  gap: 6px;
}
.waiting-dots span {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--blue);
  animation: dotBounce 1.2s ease-in-out infinite;
  opacity: 0.3;
}
.waiting-dots span:nth-child(2) { animation-delay: 0.2s; }
.waiting-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotBounce {
  0%,100%{transform:translateY(0);opacity:0.3}
  50%{transform:translateY(-6px);opacity:1}
}
.waiting-text { font-size: 13px; color: var(--muted); }

/* ── ERROR PAGE ── */
.error-page {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}
.error-page .icon { font-size: 52px; margin-bottom: 16px; }
.error-page h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
.error-page p  { font-size: 13px; line-height: 1.6; }
.error-page code {
  display: inline-block;
  background: #f7fafc;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 8px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--blue);
  margin-top: 12px;
}

/* Entrada animada */
.wrapper { animation: slideUp 0.5s ease both; }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<header class="top-bar">
  <div class="top-logo">🐟 AquaNode <span>Monitor de Estanque</span></div>
  <div class="conn-pill">
    <div class="conn-dot" id="connDot"></div>
    <span id="connStatus">Conectando...</span>
  </div>
</header>

<div class="wrapper" id="wrapper">
  <!-- Se rellena por JS -->
</div>

<script>
/* ══════════════════════════════════════
   CONFIG
══════════════════════════════════════ */
const BROKER  = "wss://6d31b72c4c354177bb806d74d6a1dcbe.s1.eu.hivemq.cloud:8884/mqtt";
const MQUSER  = "hivemq.webclient.1778085461653";
const MQPASS  = "P2q3Zmgp#,QxEBG8a;&6";

/* ══════════════════════════════════════
   LEER PARÁMETROS URL
   sala, estanque + valores de temperatura
   que genera qr.html automáticamente
══════════════════════════════════════ */
const params  = new URLSearchParams(window.location.search);
const sala    = parseInt(params.get('sala'))    || null;
const estanque= parseInt(params.get('estanque'))|| null;

// Valores de temperatura: vienen de la URL si fueron generados por qr.html
// Si no existen, se usan los valores por defecto
const TEMP_OBJ_MIN  = parseFloat(params.get('tmin')) || 18;
const TEMP_OBJ_MAX  = parseFloat(params.get('tmax')) || 24;
const GAUGE_ABS_MIN = parseFloat(params.get('gmin')) || 10;
const GAUGE_ABS_MAX = parseFloat(params.get('gmax')) || 25;

/* ══════════════════════════════════════
   VALIDAR
══════════════════════════════════════ */
if (!sala || !estanque) {
  document.getElementById('wrapper').innerHTML = `
    <div class="error-page">
      <div class="icon">⚠️</div>
      <h2>Parámetros incorrectos</h2>
      <p>Esta página necesita sala y estanque en la URL.</p>
      <p>Ejemplo:<br><code>estanque.html?sala=1&estanque=3</code></p>
    </div>`;
} else {
  buildUI();
}

/* ══════════════════════════════════════
   CONSTRUIR UI
══════════════════════════════════════ */
function buildUI() {
  document.title = `AquaNode | Sala ${sala} — Estanque ${estanque}`;
  const rango   = GAUGE_ABS_MAX - GAUGE_ABS_MIN;
  const leftPct = ((TEMP_OBJ_MIN - GAUGE_ABS_MIN) / rango * 100).toFixed(1);
  const widPct  = ((TEMP_OBJ_MAX - TEMP_OBJ_MIN)  / rango * 100).toFixed(1);

  document.getElementById('wrapper').innerHTML = `
    <!-- Card principal -->
    <div class="card" id="mainCard">
      <div class="card-label">
        <span class="card-name">Sala ${sala} — Estanque ${estanque}</span>
        <div class="status-pill wait" id="statusPill">
          <div class="status-dot-sm"></div>
          <span id="statusText">Esperando...</span>
        </div>
      </div>

      <div id="waitingState" class="waiting">
        <div class="waiting-dots">
          <span></span><span></span><span></span>
        </div>
        <div class="waiting-text">Esperando datos del sensor...</div>
      </div>

      <div id="dataState" style="display:none">
        <div class="temp-display">
          <span class="temp-big normal" id="tempBig">--.-</span>
          <span class="temp-unit-big">°C</span>
        </div>
        <div class="trend-badge neutral" id="trendBadge">→ sin datos</div>
        <div class="minmax">
          <span class="minmax-max" id="maxVal">↑ --.-°C</span>
          <span class="minmax-min" id="minVal">↓ --.-°C</span>
        </div>
        <div class="gauge-wrap">
          <div class="gauge-track">
            <div class="gauge-target" style="left:${leftPct}%;width:${widPct}%"></div>
            <div class="gauge-fill"   id="gaugeFill"   style="width:0%"></div>
            <div class="gauge-needle" id="gaugeNeedle" style="left:0%"></div>
          </div>
          <div class="gauge-limits">
            <span>${GAUGE_ABS_MIN}°C</span>
            <span>${GAUGE_ABS_MAX}°C</span>
          </div>
        </div>
        <div class="last-update" id="lastUpdate">--</div>
      </div>
    </div>

    <!-- Rango objetivo -->
    <div class="range-info">
      <div class="range-item">
        <span class="range-label">🎯 Objetivo</span>
        <span class="range-val">${TEMP_OBJ_MIN}°C – ${TEMP_OBJ_MAX}°C</span>
      </div>
      <div class="range-item">
        <span class="range-label">📊 Escala</span>
        <span class="range-val">${GAUGE_ABS_MIN}°C – ${GAUGE_ABS_MAX}°C</span>
      </div>
      <div class="range-item">
        <span class="range-label">📡 Topic MQTT</span>
        <span class="range-val" style="font-size:11px">hatchery/sala${sala}/estanque${estanque}</span>
      </div>
    </div>

    <!-- Info pie -->
    <div class="info-card">
      <span>AquaNode Smart Monitoring</span>
      <strong>sysops: felipe.ramirez@ucn.cl</strong>
    </div>
  `;

  connectMQTT();
}

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
const readings = [];  // {t, v}

/* ══════════════════════════════════════
   MQTT
══════════════════════════════════════ */
function connectMQTT() {
  const topic = `hatchery/sala${sala}/estanque${estanque}/temperatura`;

  const client = mqtt.connect(BROKER, {
    username: MQUSER,
    password: MQPASS,
    clientId: 'aquanode_est_' + Math.random().toString(16).slice(2, 8),
    clean: true
  });

  client.on('connect', () => {
    setConn('ok', 'Conectado');
    client.subscribe(topic);
  });
  client.on('error',   () => setConn('err', 'Error'));
  client.on('offline', () => setConn('',    'Desconectado'));

  client.on('message', (t, payload) => {
    try {
      const data  = JSON.parse(payload.toString());
      const valor = parseFloat(data.valor);
      if (isNaN(valor)) return;
      onReading(valor, new Date());
    } catch(e) {}
  });
}

function setConn(cls, text) {
  document.getElementById('connDot').className = 'conn-dot ' + cls;
  document.getElementById('connStatus').textContent = text;
}

/* ══════════════════════════════════════
   ACTUALIZAR UI
══════════════════════════════════════ */
function onReading(temp, date) {
  readings.push({ t: date, v: temp });
  if (readings.length > 120) readings.shift();

  // Mostrar datos
  document.getElementById('waitingState').style.display = 'none';
  document.getElementById('dataState').style.display    = 'block';

  const rango = GAUGE_ABS_MAX - GAUGE_ABS_MIN;
  let colorClass = 'normal', statusClass = 'ok', statusLabel = '✓ Normal', fillColor = '#34c759';

  if (temp < TEMP_OBJ_MIN - 2) {
    colorClass = 'cold'; statusClass = 'cold'; statusLabel = '❄ Muy frío'; fillColor = '#32ade6';
  } else if (temp < TEMP_OBJ_MIN) {
    colorClass = 'cold'; statusClass = 'cold'; statusLabel = '↓ Frío'; fillColor = '#32ade6';
  } else if (temp > TEMP_OBJ_MAX + 2) {
    colorClass = 'hot';  statusClass = 'hot';  statusLabel = '🔴 Muy caliente'; fillColor = '#ff3b30';
  } else if (temp > TEMP_OBJ_MAX) {
    colorClass = 'warn'; statusClass = 'warn'; statusLabel = '↑ Caliente'; fillColor = '#ff9500';
  }

  // Temp grande
  const tb = document.getElementById('tempBig');
  tb.className = 'temp-big ' + colorClass;
  tb.textContent = temp.toFixed(1);

  // Card color
  const card = document.getElementById('mainCard');
  card.className = 'card ' + (colorClass === 'hot' ? 'hot' : colorClass === 'cold' ? 'cold' : '');

  // Status pill
  const pill = document.getElementById('statusPill');
  pill.className = 'status-pill ' + statusClass;
  document.getElementById('statusText').textContent = statusLabel;

  // Gauge
  const pct = Math.min(100, Math.max(0, (temp - GAUGE_ABS_MIN) / rango * 100));
  document.getElementById('gaugeFill').style.width      = pct + '%';
  document.getElementById('gaugeFill').style.background = fillColor;
  document.getElementById('gaugeNeedle').style.left     = pct + '%';
  document.getElementById('gaugeNeedle').style.background = fillColor;

  // Max / Min
  let maxV = readings[0].v, minV = readings[0].v;
  readings.forEach(r => { if (r.v > maxV) maxV = r.v; if (r.v < minV) minV = r.v; });
  document.getElementById('maxVal').textContent = `↑ ${maxV.toFixed(1)}°C`;
  document.getElementById('minVal').textContent = `↓ ${minV.toFixed(1)}°C`;

  // Tendencia
  const now   = date.getTime();
  const h1ago = now - 3600000;
  let ref = readings[0];
  readings.forEach(r => {
    if (Math.abs(r.t.getTime() - h1ago) < Math.abs(ref.t.getTime() - h1ago)) ref = r;
  });
  const delta = temp - ref.v;
  const tr    = document.getElementById('trendBadge');
  if (Math.abs(delta) < 0.05) {
    tr.className = 'trend-badge neutral'; tr.textContent = '→ Estable';
  } else {
    const sube = delta > 0;
    tr.className = 'trend-badge ' + (sube ? 'up-bad' : 'down-good');
    tr.textContent = (sube ? '↑ ' : '↓ ') + Math.abs(delta).toFixed(2) + '°C/hr';
  }

  document.getElementById('lastUpdate').textContent =
    'Actualizado: ' + date.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  // Flash
  card.classList.remove('flash');
  void card.offsetWidth;
  card.classList.add('flash');
}
</script>
</body>
</html>
